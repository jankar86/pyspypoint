services:
  spypoint-smoke-test:
    build: .
    command: ["python", "smoke_test.py"]
    env_file: .env
  spypoint-archive:
    build: .
    command: ["python", "archive.py"]
    env_file: .env
    environment:
      SPYPOINT_ARCHIVE_DIR: /archive
    user: "${ARCHIVE_UID:-1000}:${ARCHIVE_GID:-1000}"
    volumes:
      - ./archive:/archive
  spypoint-poller:
    profiles: ["poller"]
    build: .
    env_file: .env
    environment:
      SPYPOINT_ARCHIVE_DIR: /archive
    user: "${ARCHIVE_UID:-1000}:${ARCHIVE_GID:-1000}"
    volumes:
      - ./archive:/archive
    restart: unless-stopped
  spypoint-gallery:
    profiles: ["gallery"]
    image: gtstef/filebrowser:stable
    environment:
      FILEBROWSER_CONFIG: /config/config.yaml
      FILEBROWSER_DATABASE_PATH: /data/database.sqlite
    ports:
      - "${SPYPOINT_GALLERY_BIND:-127.0.0.1}:8080:80"
    volumes:
      - ./archive:/srv:ro
      - ./gallery-data:/data
      - ./gallery-config.yaml:/config/config.yaml:ro
    user: "${ARCHIVE_UID:-1000}:${ARCHIVE_GID:-1000}"
    restart: unless-stopped
